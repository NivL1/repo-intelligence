# Fly.io app config. This only runs the API+dashboard container —
# Postgres and Redis are external managed services (Neon, Upstash)
# rather than Fly apps of their own.
#
# DEMO_MODE, DATABASE_URL, REDIS_URL, OPENAI_API_KEY and the JWT
# secrets are NOT here — they're `fly secrets`, not static [env],
# specifically so DEMO_MODE can be flipped (false while seeding the
# one demo repo through the normal authenticated flow, true once
# that's done — see scripts/seed-demo-repo.sh) without editing this
# file or rebuilding the image.
app = "repo-intelligence-demo"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LLM_PROVIDER = "openai"
  EMBEDDINGS_PROVIDER = "onnx"
  DATABASE_SSL = "true"
  CORS_ORIGIN = "https://repo-intelligence-demo.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
