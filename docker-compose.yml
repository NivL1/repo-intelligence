services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_intelligence
    ports:
      # Host-side 5433, not 5432: avoids clashing with a native Postgres
      # already running on this machine. Internal service-to-service
      # traffic (migrate, app) uses the default 5432 on the compose
      # network regardless of this mapping.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs migrations then exits. Needs the builder stage (full
  # devDependencies + source) since `migration:run` goes through
  # typeorm-ts-node-commonjs, not compiled dist/.
  migrate:
    build:
      context: .
      target: builder
    command: npm run migration:run
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/repo_intelligence
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/repo_intelligence
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
